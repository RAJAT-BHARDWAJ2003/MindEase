/* ── PARTICLE BACKGROUND ── */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height,
    r:Math.random()*2, dx:(Math.random()-0.5)*0.5, dy:(Math.random()-0.5)*0.5
  });
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#8a2be2";
  particles.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
  });
  requestAnimationFrame(animate);
}
animate();

/* ── MEMORY ── */

/* ── MOOD DETECTION ── */
function detectMood(text){
  const t = text.toLowerCase();
  if(t.match(/suicid|want to die|end my life|kill myself/)) return "In Crisis 🆘";
  if(t.match(/depress|hopeless|worthless|hate myself/)) return "Very Low 💔";
  if(t.match(/sad|lonely|crying|miss|heartbroken/)) return "Sad 😔";
  if(t.match(/stress|anxious|overwhelm|panic|worry/)) return "Stressed 😟";
  if(t.match(/angry|furious|rage|frustrated|hate/)) return "Angry 😠";
  if(t.match(/happy|great|amazing|wonderful|excited|grateful/)) return "Happy 😊";
  if(t.match(/tired|exhausted|drained|sleepy/)) return "Tired 😴";
  if(t.match(/okay|fine|good|alright/)) return "Neutral 🙂";
  return "Calm 🙂";
}

/* ── RESPONSE LOGIC ── */
function generateResponse(text){
  const t = text.toLowerCase().trim();

  // Score-based matching: longer/more-specific keyword = higher score
  let bestMatch = null;
  let bestScore = 0;

  for(const entry of keywordResponses){
    for(const key of entry.keys){
      // Use word-boundary regex so "good" doesn't fire inside "relationship" or "good morning"
      const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp('(?:^|\\s)' + escaped + '(?:\\s|$|[.,!?])', 'i');
      if(regex.test(t)){
        // Prefer longer (more specific) keyword matches
        if(key.length > bestScore){
          bestScore = key.length;
          bestMatch = entry.res;
        }
      }
    }
  }

  if(bestMatch) return bestMatch;

  // Fallback
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

/* ── SEND MESSAGE ── */
function enterSend(e){ if(e.key==="Enter") sendMessage(); }

function sendMessage(){
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user", true);
  document.getElementById("moodMeter").innerText = "Mood: " + detectMood(text);
  input.value = "";

  showTyping();

  setTimeout(()=>{
    removeTyping();
    addMessage(generateResponse(text), "bot", true);
  }, 1000 + Math.random()*800);
}

/* ── ADD MESSAGE ── */
function addMessage(text, type, save){
  const msg = document.createElement("div");
  msg.classList.add("message", type);

  if(type === "bot"){
    // Use data attribute to avoid quote-escaping issues in onclick
    const safeId = "v_" + Date.now();
    msg.innerHTML = text.replace(/\n/g,"<br>") +
      `<br><button class='voice-btn' data-id='${safeId}' onclick="speakById('${safeId}')">🔊 Voice</button>`;
    msg.dataset.speech = text;
    msg.id = safeId;
  } else {
    msg.innerText = text;
  }

  chatbox.appendChild(msg);
  chatbox.scrollTop = chatbox.scrollHeight;

  if(save){
    history.push({text, type});
    localStorage.setItem("giniChat", JSON.stringify(history));
  }
}

/* ── TYPING ── */
function showTyping(){
  const msg = document.createElement("div");
  msg.classList.add("message","bot","typing");
  msg.id = "typing";
  msg.innerText = "Gini is here for you...";
  chatbox.appendChild(msg);
  chatbox.scrollTop = chatbox.scrollHeight;
}
function removeTyping(){
  const t = document.getElementById("typing");
  if(t) t.remove();
}

function speakById(id){
  const el = document.getElementById(id);
  if(!el) return;
  const text = el.dataset.speech;
  if(!text) return;
  speakText(text);
}

function speakText(text){
  // Cancel any ongoing speech first
  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.rate = 0.9;
  speech.pitch = 1.2;
  speech.lang = "en-US";

  // Reload voices if cache is empty (timing fix)
  if(cachedVoices.length === 0){
    cachedVoices = speechSynthesis.getVoices();
  }

  const femaleKeywords = ["female","woman","zira","samantha","victoria","karen","moira","fiona","google uk english female","microsoft zira"];
  const femaleVoice = cachedVoices.find(v =>
    femaleKeywords.some(k => v.name.toLowerCase().includes(k))
  );

  if(femaleVoice){
    speech.voice = femaleVoice;
  }

  // Chrome bug workaround: long text gets cut off — split into chunks
  if(text.length > 200){
    const sentences = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
    let i = 0;
    function speakNext(){
      if(i >= sentences.length) return;
      const chunk = new SpeechSynthesisUtterance(sentences[i].trim());
      chunk.rate = 0.9; chunk.pitch = 1.2; chunk.lang = "en-US";
      if(femaleVoice) chunk.voice = femaleVoice;
      chunk.onend = () => { i++; speakNext(); };
      speechSynthesis.speak(chunk);
    }
    speakNext();
    return;
  }

  speechSynthesis.speak(speech);
}

/* ── VOICE INPUT ── */
function startListening(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert("Speech recognition not supported in this browser.");
    return;
  }
  const recognition = new SR();
  recognition.lang = "en-US";
  recognition.start();
  recognition.onresult = function(event){
    const result = event.results[0][0].transcript;
    document.getElementById("userInput").value = result;
    sendMessage();
  };
  recognition.onerror = function(e){
    console.warn("Speech error:", e.error);
  };
}

</script>
